name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            libimobiledevice-dev libplist-dev libusbmuxd-dev libssl-dev

      - name: Generate configure script
        run: NOCONFIGURE=1 ./autogen.sh

      - name: Build and test (default)
        run: |
          mkdir build-default
          cd build-default
          ../configure
          make -j"$(nproc)"
          make check VERBOSE=1
          ./src/ios_webkit_debug_proxy -V

      - name: Build and test (ASan + UBSan)
        run: |
          mkdir build-asan
          cd build-asan
          ../configure CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          make -j"$(nproc)"
          ASAN_OPTIONS=detect_leaks=1 make check VERBOSE=1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config \
            libimobiledevice libplist libusbmuxd openssl

      - name: Build and test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ./autogen.sh
          make -j"$(sysctl -n hw.ncpu)"
          make check VERBOSE=1
          ./src/ios_webkit_debug_proxy -V

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-libusbmuxd
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pcre

      - name: Build and test
        run: |
          ./autogen.sh
          make -j"$(nproc)"
          make check VERBOSE=1
          ./src/ios_webkit_debug_proxy -V
